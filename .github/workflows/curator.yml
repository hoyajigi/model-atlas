name: Curator agent

on:
  schedule:
    - cron: '20 22 * * 1,4' # 07:20 KST Mon/Thu
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pass the job's GITHUB_TOKEN explicitly: without it the action falls
          # back to the GitHub App path and requests an OIDC token, which needs
          # `id-token: write` and fails the job before Claude ever starts.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: /curate
          claude_args: '--max-turns 80'
